<script>
/* ------------------------------------------------------------------
   window.storage

   Inside Claude, artifacts get this API for free. Outside, it has to be
   provided. IndexedDB rather than localStorage because the certificate
   uploads and event photos are base64 and would blow localStorage's ~5MB
   ceiling; IndexedDB has no practical limit at this scale and stores the
   strings without a second encoding pass.

   Same shape as the original: every method is async, get/set/delete return
   { key, value, shared } and get returns null for a key that isn't there.
   The `shared` flag is accepted and ignored — there is no second user on a
   single-browser install, so everything is personal.
   ------------------------------------------------------------------ */
(function () {
  var DB_NAME = "eventtrack";
  var STORE = "kv";
  var dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var store = t.objectStore(STORE);
        var req = fn(store);
        t.onabort = t.onerror = function () { reject(t.error); };
        t.oncomplete = function () { resolve(req ? req.result : undefined); };
      });
    });
  }

  /* Private browsing and a few locked-down configurations block IndexedDB.
     Falling back to memory keeps the app usable for the session rather than
     failing at the first read — the banner below explains the catch. */
  var memory = null;
  function useMemory() {
    if (!memory) {
      memory = {};
      var n = document.createElement("div");
      n.textContent = "Storage is unavailable in this browser, so nothing entered here will be kept after you close the tab.";
      n.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#b45309;color:#fff;"
        + "font:500 12px/1.5 system-ui,sans-serif;padding:8px 14px;text-align:center";
      if (document.body) document.body.appendChild(n);
    }
    return memory;
  }

  window.storage = {
    get: function (key) {
      return tx("readonly", function (s) { return s.get(key); })
        .then(function (v) { return v === undefined ? null : { key: key, value: v, shared: false }; })
        .catch(function () {
          var m = useMemory();
          return m[key] === undefined ? null : { key: key, value: m[key], shared: false };
        });
    },
    set: function (key, value) {
      return tx("readwrite", function (s) { return s.put(value, key); })
        .then(function () { return { key: key, value: value, shared: false }; })
        .catch(function () {
          useMemory()[key] = value;
          return { key: key, value: value, shared: false };
        });
    },
    delete: function (key) {
      return tx("readwrite", function (s) { return s.delete(key); })
        .then(function () { return { key: key, deleted: true, shared: false }; })
        .catch(function () {
          delete useMemory()[key];
          return { key: key, deleted: true, shared: false };
        });
    },
    list: function (prefix) {
      return tx("readonly", function (s) { return s.getAllKeys(); })
        .then(function (keys) {
          var out = (keys || []).filter(function (k) { return !prefix || String(k).indexOf(prefix) === 0; });
          return { keys: out, prefix: prefix, shared: false };
        })
        .catch(function () {
          var m = useMemory();
          var out = Object.keys(m).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
          return { keys: out, prefix: prefix, shared: false };
        });
    },
  };

  /* Everything lives in this browser. Exporting is the only backup there is,
     so make it reachable from the console rather than burying it. */
  window.eventtrackExport = function () {
    return window.storage.list("").then(function (r) {
      return Promise.all(r.keys.map(function (k) {
        return window.storage.get(k).then(function (v) { return [k, v ? v.value : null]; });
      }));
    }).then(function (pairs) {
      var dump = {};
      pairs.forEach(function (p) { dump[p[0]] = p[1]; });
      var blob = new Blob([JSON.stringify(dump)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "eventtrack-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      return "Backup downloaded.";
    });
  };

  window.eventtrackImport = function (json) {
    var dump = typeof json === "string" ? JSON.parse(json) : json;
    return Promise.all(Object.keys(dump).map(function (k) {
      return window.storage.set(k, dump[k]);
    })).then(function () { return "Imported. Reload the page."; });
  };
})();

</script>
<script>
/* ============================================================================
   Cloud storage adapter

   Replaces the local-only window.storage when a Supabase project is
   configured. Three jobs:

     1. Nobody sees data before signing in.
     2. Two people saving at once must not silently overwrite each other.
     3. A dropped connection must not lose what is on screen.

   The role comes from the server, not from the browser. That is the whole
   point of moving off the PIN screen: a PIN checked in the browser is a lock
   on a cupboard, and the records here need better than that.
   ============================================================================ */
(function () {
  var CFG = window.EVENTTRACK_CONFIG || {};
  var CONFIGURED = !!(CFG.url && CFG.anonKey && CFG.url.indexOf("PASTE") === -1);

  /* No project configured: leave the local IndexedDB storage in place and let
     the app run exactly as it did before. */
  if (!CONFIGURED) {
    window.EVENTTRACK_MODE = "local";
    window.__eventtrackBoot = function () { return Promise.resolve(null); };
    return;
  }

  window.EVENTTRACK_MODE = "cloud";

  var sb = null;               // supabase client
  var versions = {};           // key -> last version this tab wrote or read
  var cache = {};              // key -> value, for offline reads
  var pollTimer = null;

  /* ---------------------------------------------------------------- UI bits */

  function el(tag, css, text) {
    var n = document.createElement(tag);
    if (css) n.style.cssText = css;
    if (text) n.textContent = text;
    return n;
  }

  function banner(text, tone) {
    var existing = document.getElementById("et-banner");
    if (existing) existing.remove();
    var n = el("div", "position:fixed;bottom:0;left:0;right:0;z-index:99999;padding:9px 14px;"
      + "font:500 12.5px/1.55 system-ui,-apple-system,sans-serif;text-align:center;color:#fff;"
      + "background:" + (tone === "bad" ? "#b91c1c" : tone === "warn" ? "#b45309" : "#065f46"), text);
    n.id = "et-banner";
    document.body.appendChild(n);
    return n;
  }

  /* ------------------------------------------------------------ sign-in UI */

  function signInScreen() {
    return new Promise(function (resolve) {
      var wrap = el("div", "position:fixed;inset:0;z-index:99998;display:flex;align-items:center;"
        + "justify-content:center;background:#f8fafc;padding:20px;"
        + "font-family:system-ui,-apple-system,'Segoe UI',sans-serif");

      var card = el("div", "width:100%;max-width:360px;background:#fff;border:1px solid #e2e8f0;"
        + "border-radius:12px;padding:26px;box-shadow:0 1px 3px rgba(0,0,0,.06)");

      var h = el("div", "font-size:19px;font-weight:800;color:#064e3b;letter-spacing:-.3px", "EventTrack");
      var sub = el("div", "font-size:12.5px;color:#64748b;margin:6px 0 20px;line-height:1.6",
        "Sign in to reach your organisation's records.");

      function field(labelText, type, auto) {
        var l = el("label", "display:block;font-size:11px;font-weight:700;text-transform:uppercase;"
          + "letter-spacing:.6px;color:#64748b;margin-bottom:5px", labelText);
        var i = document.createElement("input");
        i.type = type;
        i.autocomplete = auto;
        i.style.cssText = "width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:7px;"
          + "padding:11px 12px;font-size:16px;margin-bottom:14px;outline:none";
        i.onfocus = function () { i.style.borderColor = "#047857"; i.style.boxShadow = "0 0 0 3px #a7f3d055"; };
        i.onblur = function () { i.style.borderColor = "#cbd5e1"; i.style.boxShadow = "none"; };
        return { label: l, input: i };
      }

      var email = field("Email", "email", "username");
      var pass = field("Password", "password", "current-password");

      var btn = el("button", "width:100%;background:#065f46;color:#fff;border:0;border-radius:7px;"
        + "padding:12px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px", "Sign in");

      var err = el("div", "font-size:12px;color:#b91c1c;margin-top:12px;line-height:1.5;display:none");

      var note = el("div", "font-size:11px;color:#94a3b8;margin-top:18px;line-height:1.6;"
        + "border-top:1px solid #f1f5f9;padding-top:14px",
        "Accounts are created by your administrator in the Supabase dashboard. "
        + "There is no self sign-up, and no password reset from this screen.");

      function fail(msg) {
        err.textContent = msg;
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
        btn.style.opacity = "1";
      }

      function submit() {
        var e = email.input.value.trim();
        var p = pass.input.value;
        if (!e || !p) { fail("Enter your email and password."); return; }
        btn.disabled = true;
        btn.textContent = "Signing in\u2026";
        btn.style.opacity = ".7";
        err.style.display = "none";

        sb.auth.signInWithPassword({ email: e, password: p }).then(function (r) {
          if (r.error) {
            fail(r.error.message === "Invalid login credentials"
              ? "That email and password did not match. Check with your administrator if you are unsure."
              : r.error.message);
            return;
          }
          loadMembership().then(function (m) {
            if (!m) {
              sb.auth.signOut();
              fail("That account signed in, but is not attached to an organisation yet. "
                + "Your administrator needs to add you to the members table.");
              return;
            }
            wrap.remove();
            resolve(m);
          }).catch(function (x) { fail(x.message || "Could not load your account."); });
        }).catch(function (x) { fail(x.message || "Could not reach the server."); });
      }

      btn.onclick = submit;
      [email.input, pass.input].forEach(function (i) {
        i.onkeydown = function (ev) { if (ev.key === "Enter") submit(); };
      });

      card.appendChild(h); card.appendChild(sub);
      card.appendChild(email.label); card.appendChild(email.input);
      card.appendChild(pass.label); card.appendChild(pass.input);
      card.appendChild(btn); card.appendChild(err); card.appendChild(note);
      wrap.appendChild(card);
      document.body.appendChild(wrap);
      setTimeout(function () { email.input.focus(); }, 60);
    });
  }

  /* ------------------------------------------------------------ membership */

  function loadMembership() {
    return sb.from("members").select("org_id, role, full_name").maybeSingle().then(function (r) {
      if (r.error) throw new Error(r.error.message);
      if (!r.data) return null;
      return { orgId: r.data.org_id, role: r.data.role, name: r.data.full_name || "" };
    });
  }

  /* --------------------------------------------------------------- storage */

  function serverGet(key) {
    return sb.from("app_state").select("value, version").eq("key", key).maybeSingle()
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        if (!r.data) { versions[key] = 0; return null; }
        versions[key] = r.data.version;
        cache[key] = r.data.value;
        return { key: key, value: r.data.value, shared: true };
      });
  }

  var conflictShown = false;
  function onConflict() {
    if (conflictShown) return;
    conflictShown = true;
    banner("Somebody else saved a change while this page was open. Reloading so you do not "
      + "overwrite their work \u2014 your last unsaved edit will need redoing.", "warn");
    setTimeout(function () { location.reload(); }, 4000);
  }

  function serverSet(key, value) {
    var expected = versions[key] === undefined ? null : versions[key];
    return sb.rpc("put_state", { p_key: key, p_value: value, p_expected_version: expected })
      .then(function (r) {
        if (r.error) throw new Error(r.error.message);
        if (r.data === -1 || r.data === null) { onConflict(); throw new Error("stale write"); }
        versions[key] = r.data;
        cache[key] = value;
        return { key: key, value: value, shared: true };
      });
  }

  /* Another device saving means this one is out of date. Checking every ten
     seconds is enough for a team of three and costs almost nothing. */
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(function () {
      var keys = Object.keys(versions);
      if (!keys.length || document.hidden) return;
      sb.from("app_state").select("key, version").then(function (r) {
        if (r.error || !r.data) return;
        var changed = r.data.some(function (row) {
          return versions[row.key] !== undefined && row.version > versions[row.key];
        });
        if (changed && !conflictShown) {
          conflictShown = true;
          banner("Updated elsewhere \u2014 refreshing to show the latest records.", "ok");
          setTimeout(function () { location.reload(); }, 1800);
        }
      });
    }, 10000);
  }

  window.__eventtrackBoot = function () {
    return import("https://esm.sh/@supabase/supabase-js@2.45.4").then(function (mod) {
      sb = mod.createClient(CFG.url, CFG.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true },
      });

      return sb.auth.getSession().then(function (r) {
        if (!r.data.session) return signInScreen();
        return loadMembership().then(function (m) {
          if (m) return m;
          return sb.auth.signOut().then(signInScreen);
        });
      });
    }).then(function (member) {
      /* The app reads this instead of showing its own PIN screen. */
      window.EVENTTRACK_SESSION = { name: member.name || "Signed in", role: member.role };

      window.eventtrackSignOut = function () {
        return sb.auth.signOut().then(function () { location.reload(); });
      };

      window.storage = {
        get: function (key) {
          return serverGet(key).catch(function () {
            /* Offline: fall back to whatever this device last saw. */
            return cache[key] === undefined ? null : { key: key, value: cache[key], shared: true };
          });
        },
        set: function (key, value) {
          return serverSet(key, value).catch(function (e) {
            if (String(e.message) !== "stale write") {
              banner("Not saved \u2014 no connection to the server. Keep this tab open; "
                + "the next successful save will send it.", "bad");
            }
            throw e;
          });
        },
        delete: function (key) {
          return sb.from("app_state").delete().eq("key", key).then(function () {
            delete versions[key]; delete cache[key];
            return { key: key, deleted: true, shared: true };
          });
        },
        list: function (prefix) {
          return sb.from("app_state").select("key").then(function (r) {
            var keys = (r.data || []).map(function (x) { return x.key; })
              .filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
            return { keys: keys, prefix: prefix, shared: true };
          });
        },
      };

      startPolling();
      return member;
    });
  };
})();

</script>
</head>

  }, 6000);

    var b = document.getElementById("boot");

    var m = document.getElementById("boot-msg");

  });
</script>
<script type="module">
window.__booted = true;
/* Cloud mode signs the user in first and swaps window.storage. Local mode
   resolves immediately and leaves the IndexedDB version in place. */
await window.__eventtrackBoot();
import React, { useState, useEffect, useMemo, useRef } from "react";
import { createRoot } from "react-dom/client";
import { Lock, Plus, Pencil, Trash2, CheckCircle2, XCircle, Search, X, CreditCard, Users, CalendarDays, Wallet, LogIn, LogOut, ClipboardList, AlertTriangle, Phone, Save, Ban, Download, ListChecks, MapPin, Link2, StickyNote, Loader2, FileText, Settings as SettingsIcon, Printer, SlidersHorizontal, Mail, ChevronDown, ChevronUp, Award, MessageSquare, Clock, UserCheck, Undo2, TrendingUp, BellRing, Copy, Menu, Calendar, ChevronLeft, ChevronRight } from "lucide-react";

/* ==================================================================
   Storage & constants
   ================================================================== */

const STORAGE_KEY = "eventtrack_data_v2";
const LEGACY_KEY = "eventtrack_data_v1";
const PAYMENT_METHODS = ["bKash Personal", "bKash Merchant", "Nagad", "Rocket", "Bank Transfer", "Cash", "SSLCommerz", "Card", "PayPal", "Wise"];

/* Where the enrollment came from — feeds the marketing report */
const SOURCES = ["Facebook", "Instagram", "LinkedIn", "YouTube", "Google search", "Website", "Email / newsletter", "WhatsApp group", "Referral", "Past participant", "Partner organisation", "Walk-in", "Other"];
const CURRENCIES = [{
  code: "BDT",
  symbol: "\u09F3",
  locale: "en-IN"
}, {
  code: "USD",
  symbol: "$",
  locale: "en-US"
}, {
  code: "EUR",
  symbol: "\u20AC",
  locale: "de-DE"
}, {
  code: "GBP",
  symbol: "\u00A3",
  locale: "en-GB"
}, {
  code: "INR",
  symbol: "\u20B9",
  locale: "en-IN"
}, {
  code: "AUD",
  symbol: "A$",
  locale: "en-AU"
}, {
  code: "CAD",
  symbol: "C$",
  locale: "en-CA"
}, {
  code: "AED",
  symbol: "AED ",
  locale: "en-AE"
}];

/* ------------------------------------------------------------------
   Roles

   This is a lock on the cupboard, not a bank vault. Everything runs in
   the browser, so someone determined could read the stored data with
   developer tools. What it does reliably prevent is the realistic
   problem: a volunteer on a shared tablet deleting an enrolment or
   editing a fee by accident, and casual onlookers reading who owes what.
   ------------------------------------------------------------------ */

const ROLES = {
  admin: {
    label: "Admin",
    blurb: "Full access to everything, including money, deletions and settings.",
    tabs: ["dashboard", "calendar", "participants", "events", "facilitators", "enrollments", "payments", "checkin"],
    can: {
      manage: true,
      money: true,
      attend: true,
      docs: true,
      delete: true,
      settings: true,
      contacts: true
    }
  },
  executive: {
    label: "Executive",
    blurb: "Day-to-day running. Enrols participants, takes payments, marks attendance and issues paperwork. Cannot delete records or change settings.",
    tabs: ["dashboard", "calendar", "participants", "events", "facilitators", "enrollments", "payments", "checkin"],
    can: {
      manage: true,
      money: true,
      collect: true,
      attend: true,
      docs: true,
      contacts: true
    }
  },
  volunteer: {
    label: "Volunteer",
    blurb: "Check-in desk. Marks attendance, sees who owes what, and records payments taken at the door. Cannot edit fees, change past records, delete anything or see the overall books.",
    tabs: ["checkin"],
    can: {
      attend: true,
      contacts: true,
      collect: true
    }
  },
  guest: {
    label: "Guest",
    blurb: "Read-only view of the schedule and events. No participant list, no money, no editing.",
    tabs: ["dashboard", "calendar", "events"],
    can: {}
  }
};
const roleTabs = role => ROLES[role]?.tabs || [];
const roleCan = (role, perm) => !!ROLES[role]?.can?.[perm];

/** Name to stamp on a record. Empty when sign-in is switched off. */
const actorOf = user => user?.name ? user.name : "";
const randomSalt = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/** SHA-256 where the browser allows it; a marked plain value where it doesn't. */
async function hashPin(pin, salt) {
  try {
    if (typeof crypto !== "undefined" && crypto.subtle) {
      const bytes = new TextEncoder().encode(`${salt}:${pin}`);
      const buf = await crypto.subtle.digest("SHA-256", bytes);
      return "s256:" + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

/** Every event has a session list, whether it runs one day or twelve. */
function sessionDatesOf(ev) {
  if (!ev) return [];
  if (ev.multiSession) return [...(ev.sessionDates || [])].sort();
  return ev.eventDate ? [ev.eventDate] : [];
}

/** Attendance used to be a plain boolean per date. Read both shapes. */
function attRecord(enr, date) {
  const raw = (enr.attendance || {})[date];
  if (raw === undefined || raw === null) return {
    status: "unmarked"
  };
  if (typeof raw === "boolean") return {
    status: raw ? "attended" : "absent"

  return {
    status: raw.status || "unmarked",
    inAt: raw.inAt,
    outAt: raw.outAt

}
function attendanceStats(ev, enr) {
  const dates = sessionDatesOf(ev);

    unmarked = 0;
  dates.forEach(d => {
    const s = attRecord(enr, d).status;
    if (s === "attended") attended++;else if (s === "absent") absent++;else unmarked++;
  });
  const total = dates.length;
  return {
    total,
    attended,
    absent,
    unmarked,
    pct: total ? Math.round(attended / total * 100) : 0
  };
}
function enrollmentTotals(data, enr) {
  const org = data.orgSettings || defaultOrg();
  const fee = Number(enr.fee || 0);
  const discount = Number(enr.discount || 0);
  const net = Math.max(0, fee - discount);
  const taxPct = Number(org.taxPercent || 0);
  const tax = Math.round(net * taxPct) / 100;
  const total = net + tax;
  const paid = data.payments.filter(p => p.enrollmentId === enr.id).reduce((s, p) => s + (p.type === "refund" ? -Number(p.amount || 0) : Number(p.amount || 0)), 0);
  return {
    fee,
    discount,
    net,
    taxPct,
    tax,
    total,
    paid,
    balance: total - paid
  };
}
function seatsFor(data, ev) {
  const capacity = Number(ev.capacity || 0);
  const taken = data.enrollments.filter(e => e.eventId === ev.id && (e.status === "active" || e.status === "completed")).length;
  const waiting = data.enrollments.filter(e => e.eventId === ev.id && e.status === "waitlist").length;
  return {
    capacity,
    taken,
    waiting,
    left: capacity ? Math.max(0, capacity - taken) : null,
    full: capacity ? taken >= capacity : false
  };
}

  const st = attendanceStats(ev, enr);

  if (!hours) return 0;

    return Math.round(hours / st.total * st.attended * 4) / 4; // quarter-hour increments
  }

}

  const org = data.orgSettings || defaultOrg();
  const reasons = [];
  if (!ev.certificateEnabled) reasons.push("Certificates are switched off for this event");
  if (st.total === 0) reasons.push("No session dates set on the event");
  if (st.pct < min) reasons.push(`Attendance ${st.pct}% is below the ${min}% required`);
  if (org.requireFeedbackForCert && !enr.feedbackReceived) reasons.push("Evaluation form not yet received");

const DOC_BASE = `@page{size:A4;margin:14mm;} body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}`;

/**
 * Opens the document in its own window and fires the print dialog there.
 * Falls back to an off-screen iframe when popups are blocked, so printing
 * always works — the previous version printed the whole app through
 * visibility CSS, which clipped anything the modal had scrolled past.
 */
function docShell(title, bodyHTML) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>${esc(title)}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>${DOC_BASE}${DOC_CSS}</style></head><body>${bodyHTML}</body></html>`;
}

/** Opens the document in its own window. Returns false if popups are blocked. */
function openDocumentWindow(title, bodyHTML, autoPrint) {
  let w = null;
  try {
    w = window.open("", "_blank", "width=940,height=1040");
  } catch (e) {
    w = null;
  }
  if (!w || !w.document) return false;
  w.document.open();
  w.document.write(docShell(title, bodyHTML));
  w.document.close();
  if (autoPrint) {
    setTimeout(() => {
      try {
        w.focus();
        w.print();
      } catch (e) {/* they can print manually */}
    }, 600);
  } else {
    try {
      w.focus();
    } catch (e) {/* noop */}
  }
  return true;
}

/**
 * Prints via a real window so the whole document reaches the printer.
 * Falls back to an off-screen iframe when popups are blocked.
 */
function printDocument(title, bodyHTML) {
  if (openDocumentWindow(title, bodyHTML, true)) return "window";
  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;";
  document.body.appendChild(frame);
  const d = frame.contentWindow.document;
  d.open();
  d.write(docShell(title, bodyHTML));
  d.close();
  setTimeout(() => {
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (e) {/* noop */}
    setTimeout(() => frame.remove(), 30000);
  }, 600);
  return "iframe";
}

/**
 * File downloads are blocked in some embedded and sandboxed contexts, and the
 * block is silent — the click simply does nothing. So the primary route is a
 * real window the browser can save from, with the download attempt as the
 * fallback rather than the other way round.
 */
function saveBlobFile(filename, blob) {
  try {
    const a = document.createElement("a");
    if (typeof a.download === "undefined") return false;
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a); // a detached anchor is ignored by some browsers
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) {
    return false;
  }
}

function base64ToBlob(b64, mime) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {
    type: mime || "application/octet-stream"
  });
}
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = () => reject(new Error("Could not read that file"));
    r.readAsDataURL(file);
  });
}
function saveDocument(filename, title, bodyHTML) {
  if (openDocumentWindow(title, bodyHTML, false)) return "window";
  const ok = saveBlobFile(filename, new Blob([docShell(title, bodyHTML)], {
    type: "text/html;charset=utf-8"
  }));
  return ok ? "download" : "blocked";
}
function buildInvoiceHTML(data, enr, assets = {}) {
  const org = data.orgSettings || defaultOrg();
  const logo = assets.logo || DEFAULT_LOGO;
  const p = data.participants.find(x => x.id === enr.participantId) || {};
  const ev = data.events.find(x => x.id === enr.eventId) || {};
  const t = enrollmentTotals(data, enr);
  const pays = data.payments.filter(x => x.enrollmentId === enr.id).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
  const dates = sessionDatesOf(ev);
  const trainers = (ev.trainerIds || []).map(id => data.trainers.find(tr => tr.id === id)?.name).filter(Boolean);
  const period = dates.length > 1 ? `${fmtDate(dates[0])} \u2013 ${fmtDate(dates[dates.length - 1])} (${dates.length} sessions)` : dates.length === 1 ? fmtDate(dates[0]) : "Dates to be confirmed";
  return `<div class="d-page">
  <div class="d-head">
    <div>
      ${logo ? `<img class="d-logo" src="${assetSrc(logo)}" alt="${esc(org.name)}">` : `<div class="d-org">${esc(org.name)}</div>`}
      <div class="d-muted">
        ${org.legalName ? esc(org.legalName) + "<br>" : ""}
        ${org.address ? esc(org.address) + "<br>" : ""}
        ${org.phone ? esc(org.phone) + "<br>" : ""}
        ${org.email ? esc(org.email) + "<br>" : ""}
        ${org.website ? esc(org.website) + "<br>" : ""}
        ${org.taxId ? "Tax ID: " + esc(org.taxId) : ""}
      </div>
    </div>
    <div>
      <div class="d-doctype">INVOICE</div>
      <div class="d-muted d-mono" style="text-align:right">
        ${esc(displayInvoiceNo(org, enr))}<br>
        Issued ${esc(fmtDate(enr.invoiceDate || todayISO()))}
      </div>
    </div>
  </div>

  <div class="d-grid">
    <div class="d-col">
      <div class="d-label">Billed to</div>
      <div class="d-strong">${esc(p.name || "")}</div>
      <div class="d-muted">
        ${p.organization ? esc(p.organization) + "<br>" : ""}
        ${p.phone ? esc(p.phone) + "<br>" : ""}
        ${p.email ? esc(p.email) + "<br>" : ""}
        ${p.location ? esc(p.location) : ""}${p.country ? ", " + esc(p.country) : ""}
      </div>
    </div>
    <div class="d-col">
      <div class="d-label">Programme</div>
      <div class="d-strong">${esc(ev.name || "")}</div>
      <div class="d-muted">
        ${esc(period)}<br>
        ${esc(ev.mode === "online" ? "Online" : "In person")}${ev.venue ? " \u00B7 " + esc(ev.venue) : ""}<br>
        ${trainers.length ? "Facilitator: " + esc(trainers.join(", ")) + "<br>" : ""}
        ${ev.contactHours ? esc(ev.contactHours) + " contact hours" : ""}
      </div>
    </div>
  </div>

  <table class="d-t">
    <thead><tr><th>Description</th><th class="r">Amount</th></tr></thead>
    <tbody>
      <tr><td>Enrolment \u2014 ${esc(ev.name || "")}</td><td class="r">${esc(fmtMoney(t.fee))}</td></tr>
      ${t.discount > 0 ? `<tr><td>Discount</td><td class="r">\u2212${esc(fmtMoney(t.discount))}</td></tr>` : ""}
      ${t.taxPct > 0 ? `<tr><td>Subtotal</td><td class="r">${esc(fmtMoney(t.net))}</td></tr>
      <tr><td>${esc(org.taxLabel || "Tax")} @ ${t.taxPct}%</td><td class="r">${esc(fmtMoney(t.tax))}</td></tr>` : ""}
      <tr class="total"><td>Total payable</td><td class="r">${esc(fmtMoney(t.total))}</td></tr>
